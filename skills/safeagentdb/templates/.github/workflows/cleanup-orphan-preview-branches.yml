name: Cleanup Orphan Preview Branches

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

env:
  SUPABASE_CLI_VERSION: 2.76.9

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Delete preview DBs whose Git branches no longer exist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PARENT_PROJECT_REF: ${{ secrets.SUPABASE_PARENT_PROJECT_REF }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: npm run preview:cleanup-orphans
